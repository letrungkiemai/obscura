# Rendered by the nginx image's envsubst at startup (${API_UPSTREAM} only;
# nginx runtime vars use $name with no braces, so they're left untouched).
# This file is included from the http{} block, so the map directive is valid here.

# Toggle the Connection header for WebSocket upgrades (the /api/sync socket).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API + WebSocket → the server container. Same-origin from the browser's
    # point of view; nginx forwards server-side.
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Lets the server emit HSTS when the edge terminated TLS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /api/sync.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived sync sockets shouldn't be reaped as idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — every other path serves index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
