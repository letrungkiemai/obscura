# GKE Autopilot fix for cert-manager installed from the static manifest.
#
# Autopilot blocks writes to the managed `kube-system` namespace, where
# cert-manager's static manifest puts its leader-election leases. We repoint the
# controller + cainjector to `--leader-election-namespace=cert-manager` (a patch
# on those Deployments), but the static manifest only granted lease RBAC in
# kube-system — so this Role/RoleBinding grants the same rights in cert-manager.
# (Helm's `global.leaderElection.namespace=cert-manager` would generate this.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-leaderelection
  namespace: cert-manager
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-leaderelection
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-leaderelection
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
  - kind: ServiceAccount
    name: cert-manager-cainjector
    namespace: cert-manager
