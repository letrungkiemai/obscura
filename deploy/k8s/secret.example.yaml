# Copy to secret.yaml, replace the values, and DO NOT commit the real one.
# Create it for real with:
#   kubectl -n obscura create secret generic obscura-secrets \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=DATABASE_URL='postgres://obscura:...@db:5432/obscura'
apiVersion: v1
kind: Secret
metadata:
  name: obscura-secrets
  namespace: obscura
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres-pass
  # Host is the Postgres Service name (db) in this namespace.
  DATABASE_URL: postgres://obscura:postgres-pass@db:5432/obscura
